name: FinSec Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests (FastAPI + Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest suite (SQLite mode, deterministic fallback)
        env:
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
          GEMINI_API_KEY: ""
          FINSEC_API_KEY: "finsec-demo-key-2026"
        run: pytest tests -v

  frontend-build:
    name: Frontend Typecheck & Build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Next.js production build
        env:
          NEXT_PUBLIC_API_BASE_URL: "https://finsec-agent-backend.onrender.com"
          NEXT_PUBLIC_FINSEC_API_KEY: "finsec-demo-key-2026"
        run: npm run build
